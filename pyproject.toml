[project]
name = "rag-benchmark-lab"
version = "0.1.0"
description = "Question answering over documents with lexical, vector, hybrid and reranked retrieval, plus reproducible comparative evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pypdf>=5.0",
    "streamlit>=1.38",
    "httpx>=0.27",
    "langchain-openai>=1.0",
    "pgvector>=0.3",
]

[project.scripts]
rag-lab = "rag_lab.cli:main"

[project.optional-dependencies]
# Local cross-encoder reranker (RERANKER_PROVIDER=local). Pulls in torch (CPU build on Linux).
local-rerank = [
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "fpdf2>=2.7",
    "ruff>=0.6",
    "mypy>=1.11",
]

# CPU-only torch wheels on Linux: the CUDA build adds gigabytes the reranker does not need.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that need a real PostgreSQL database (set TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rag_lab"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdf.*", "streamlit.*", "sentence_transformers.*"]
ignore_missing_imports = true
